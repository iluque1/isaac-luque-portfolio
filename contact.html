        <main>
            <h2>Get In Touch</h2>
            <section>
                <p>Whether you're a recruiter, a hiring manager, or just want to connect, send me a message and I'll get back to you soon.</p>

                <form>
                    <label for="name">Full Name:*</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address:*</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone">

                    <label for="company">Company Name (optional):</label>
                    <input type="text" id="company" name="company" placeholder="Where are you reaching out from?">

                    <label for="subject">Subject:*</label>
                    <input type="text" id="subject" name="subject" required>

                    <label for="message">Message:*</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit">Send</button>
                </form>
            </section>
        </main>
